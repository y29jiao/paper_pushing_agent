<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Agent — 学术论文推送控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain-overlay"></div>

  <header class="top-bar">
    <div class="logo">
      <span class="logo-icon">📚</span>
      <span class="logo-text">Paper Agent</span>
    </div>
    <div class="top-bar-right">
      <div class="mode-toggle">
        <button class="mode-btn active" id="btnModeSearch" onclick="switchMode('search')">搜索模式</button>
        <button class="mode-btn" id="btnModePush" onclick="switchMode('push')">推送模式</button>
      </div>
      <div class="status-indicator" id="statusDot">
        <span class="dot"></span>
        <span class="status-text">未连接</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- ══ SEARCH MODE: Direct browser search ══ -->
    <div id="searchModePanel">
      <section class="card search-card">
        <div class="card-header">
          <h2>🔍 论文搜索</h2>
          <span class="badge">Direct Search</span>
        </div>
        <div class="card-body">
          <div class="field-group">
            <label for="searchApiKey">OpenAI API Key <span class="hint">(存储在浏览器本地，用于 GPT 解析查询)</span></label>
            <div class="token-input-row">
              <input type="password" id="searchApiKey" placeholder="sk-..." oninput="saveSearchApiKey()">
              <button class="btn btn-outline btn-sm" onclick="toggleSearchKeyVisibility()">👁</button>
            </div>
          </div>
          <div class="field-group">
            <label for="searchQuery">搜索查询 <span class="hint">(自然语言描述，GPT 会自动生成关键词组)</span></label>
            <textarea id="searchQuery" rows="2" placeholder="例: 在建筑领域法规对比的chatbot/agent"></textarea>
          </div>
          <div class="field-group">
            <label for="searchKeywordGroups">关键词组 <span class="hint">(由 GPT 生成，也可手动编辑)</span></label>
            <textarea id="searchKeywordGroups" rows="4" placeholder="点击「生成关键词」由 GPT 自动填充，也可直接手动填写。每行一组，逗号分隔"></textarea>
            <div style="margin-top:8px;">
              <button class="btn btn-outline btn-sm" onclick="generateKeywords()">🤖 生成关键词</button>
            </div>
          </div>
          <div class="field-group inline">
            <div>
              <label for="searchMaxResults">每组最大数量</label>
              <input type="number" id="searchMaxResults" min="5" max="100" value="25">
            </div>
            <div>
              <label for="searchYearFrom">起始年份</label>
              <input type="number" id="searchYearFrom" min="2000" max="2026" placeholder="不限">
            </div>
            <div class="push-btn-wrapper">
              <button id="btnSearch" class="btn btn-primary" onclick="startSearch()">
                <span class="btn-icon">🔍</span> 开始搜索
              </button>
            </div>
          </div>
          <div id="searchStatus" class="push-status hidden"></div>
        </div>
      </section>

      <section class="card results-card hidden" id="resultsCard">
        <div class="card-header">
          <h2>📄 搜索结果</h2>
          <div class="results-header-actions">
            <span class="badge" id="resultCount">0 papers</span>
            <button class="btn btn-outline btn-sm" onclick="exportMarkdown()">📥 导出 Markdown</button>
            <button class="btn btn-outline btn-sm" onclick="copyResults()">📋 复制</button>
          </div>
        </div>
        <div class="card-body" id="resultsBody"></div>
      </section>
    </div>

    <!-- ══ PUSH MODE: Scheduled push settings ══ -->
    <div id="pushModePanel" class="hidden">
    <section class="card push-card">
      <div class="card-header">
        <h2>📬 推送设置</h2>
        <span class="badge">GitHub Actions</span>
      </div>
      <div class="card-body">
        <p class="push-description">选择要推送的 Profile，每周定时通过 GPT 生成中文摘要后发送到邮箱。如需更改推送内容，请编辑下方 Profile。</p>
        <div class="field-group" id="pushProfileChecklist">
          <!-- Populated by JS -->
        </div>
        <div id="pushStatus" class="push-status hidden"></div>
      </div>
    </section>

    <!-- Push Profiles -->
    <section class="card profiles-card">
      <div class="card-header">
        <h2>📂 推送 Profiles</h2>
        <button class="btn btn-outline btn-sm" onclick="openPushProfileModal()">+ 添加</button>
      </div>
      <div class="card-body" id="pushProfilesList">
        <!-- Populated by JS -->
      </div>
    </section>
    </div>

    <!-- ══ SEARCH MODE: Search profiles ══ -->
    <div id="searchProfilesPanel">
    <section class="card profiles-card">
      <div class="card-header">
        <h2>📂 搜索 Profiles</h2>
        <button class="btn btn-outline btn-sm" onclick="openSearchProfileModal()">+ 添加</button>
      </div>
      <div class="card-body" id="searchProfilesList">
        <!-- Populated by JS -->
      </div>
    </section>
    </div>

    <!-- ── Settings Panel (push mode only) ── -->
    <section class="card settings-card push-only-panel hidden">
      <div class="card-header">
        <h2>⚙️ 设置</h2>
      </div>
      <div class="card-body">
        <div class="settings-grid">
          <div class="field-group">
            <label for="settEmail">📧 推送邮箱</label>
            <input type="email" id="settEmail" value="yusenjiao@gmail.com">
          </div>
          <div class="field-group">
            <label for="settTimezone">🕐 时区</label>
            <select id="settTimezone">
              <option value="America/Edmonton">America/Edmonton (MDT)</option>
              <option value="America/Vancouver">America/Vancouver (PDT)</option>
              <option value="America/Toronto">America/Toronto (EDT)</option>
              <option value="America/New_York">America/New_York (EDT)</option>
              <option value="America/Chicago">America/Chicago (CDT)</option>
              <option value="America/Los_Angeles">America/Los_Angeles (PDT)</option>
              <option value="Asia/Shanghai">Asia/Shanghai (CST)</option>
              <option value="Asia/Tokyo">Asia/Tokyo (JST)</option>
              <option value="Europe/London">Europe/London (BST)</option>
              <option value="UTC">UTC</option>
            </select>
          </div>
          <div class="field-group">
            <label>📅 定时推送</label>
            <div class="schedule-row">
              <label class="checkbox-label">
                <input type="checkbox" id="schedMon" checked> 周一
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="schedTue"> 周二
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="schedWed"> 周三
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="schedThu" checked> 周四
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="schedFri"> 周五
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="schedSat"> 周六
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="schedSun"> 周日
              </label>
            </div>
          </div>
          <div class="field-group">
            <label for="schedHour">⏰ 推送时间</label>
            <input type="time" id="schedTime" value="08:00">
          </div>
        </div>
        <div class="settings-actions">
          <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
        </div>
      </div>
    </section>

    <!-- ── GitHub Token Setup (push mode only) ── -->
    <section class="card token-card push-only-panel hidden">
      <div class="card-header">
        <h2>🔑 GitHub 连接</h2>
      </div>
      <div class="card-body">
        <div class="field-group">
          <label for="ghOwner">Repository Owner</label>
          <input type="text" id="ghOwner" placeholder="your-github-username">
        </div>
        <div class="field-group">
          <label for="ghRepo">Repository Name</label>
          <input type="text" id="ghRepo" placeholder="paper-agent">
        </div>
        <div class="field-group">
          <label for="ghToken">Personal Access Token <span class="hint">(存储在浏览器本地)</span></label>
          <div class="token-input-row">
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
            <button class="btn btn-outline btn-sm" onclick="toggleTokenVisibility()">👁</button>
          </div>
        </div>
        <div class="settings-actions">
          <button class="btn btn-primary" onclick="saveGitHubConfig()">🔗 保存并连接</button>
          <button class="btn btn-outline" onclick="testConnection()">测试连接</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ── Push Profile Modal ── -->
  <div class="modal-overlay hidden" id="pushProfileModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="pushModalTitle">添加推送 Profile</h3>
        <button class="modal-close" onclick="closePushProfileModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="pushModalId">
        <div class="field-group">
          <label for="pushModalName">名称</label>
          <input type="text" id="pushModalName" placeholder="例: Construction + AI/ML 或 建筑法规Chatbot">
        </div>
        <div class="field-group">
          <label for="pushModalQuery">搜索需求 <span class="hint">(自然语言描述，GPT 会自动解析成关键词)</span></label>
          <textarea id="pushModalQuery" rows="3" placeholder="例: 帮我找在建筑领域应用 LLM 做法规对比的论文"></textarea>
        </div>
        <div class="field-group inline">
          <div>
            <label for="pushModalVenue">Venue 分组</label>
            <select id="pushModalVenue">
              <option value="any">不限</option>
              <option value="top_ai">Top AI (会议)</option>
              <option value="construction">Construction (期刊)</option>
            </select>
          </div>
          <div>
            <label for="pushModalCount">每次推送数量</label>
            <input type="number" id="pushModalCount" min="1" max="20" value="5">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closePushProfileModal()">取消</button>
        <button class="btn btn-primary" onclick="savePushProfile()">保存</button>
      </div>
    </div>
  </div>

  <!-- ── Search Profile Modal ── -->
  <div class="modal-overlay hidden" id="searchProfileModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="searchModalTitle">添加搜索 Profile</h3>
        <button class="modal-close" onclick="closeSearchProfileModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="searchModalId">
        <div class="field-group">
          <label for="searchModalName">名称</label>
          <input type="text" id="searchModalName" placeholder="例: Building Code + NLP 或 建筑法规检索">
        </div>
        <div class="field-group">
          <label for="searchModalQuery">搜索查询 <span class="hint">(自然语言描述)</span></label>
          <textarea id="searchModalQuery" rows="2" placeholder="例: 在建筑领域法规对比的chatbot/agent"></textarea>
        </div>
        <div class="field-group">
          <label for="searchModalKeywords">关键词组 <span class="hint">(可选，留空则每次搜索时由 GPT 生成)</span></label>
          <textarea id="searchModalKeywords" rows="4" placeholder="building code, compliance checking, NLP&#10;building regulation, chatbot, construction"></textarea>
        </div>
        <div class="field-group">
          <label for="searchModalMaxPerGroup">每组最大数量</label>
          <input type="number" id="searchModalMaxPerGroup" min="5" max="100" value="25">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeSearchProfileModal()">取消</button>
        <button class="btn btn-primary" onclick="saveSearchProfile()">保存</button>
      </div>
    </div>
  </div>

  <!-- ── Toast Notification ── -->
  <div class="toast hidden" id="toast">
    <span id="toastMsg"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
